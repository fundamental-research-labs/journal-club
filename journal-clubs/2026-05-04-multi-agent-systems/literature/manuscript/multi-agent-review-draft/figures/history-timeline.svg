<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Historical phases of modern multi-agent LLM systems</title>
  <desc id="desc">A timeline from pre-LLM coordination problems through agent societies, runtime frameworks, evaluation skepticism, and artifact-centered orchestration.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="axis-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#315775"/>
      <stop offset="0.52" stop-color="#8b5e75"/>
      <stop offset="1" stop-color="#2f6c66"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#2f6c66"/>
    </marker>
    <style>
      .figure-title { font: 700 39px "Helvetica Neue", Arial, sans-serif; fill: #101820; }
      .subtitle { font: 400 21px "Helvetica Neue", Arial, sans-serif; fill: #5b6673; }
      .phase-year { font: 700 17px "Helvetica Neue", Arial, sans-serif; fill: #607080; letter-spacing: 1.1px; text-transform: uppercase; }
      .phase-title { font: 700 23px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .body { font: 400 18px "Helvetica Neue", Arial, sans-serif; fill: #2d3748; }
      .small { font: 500 16px "Helvetica Neue", Arial, sans-serif; fill: #485565; }
      .tag-title { font: 700 14px "Helvetica Neue", Arial, sans-serif; fill: #5c6675; letter-spacing: .8px; text-transform: uppercase; }
      .footer { font: 500 20px "Helvetica Neue", Arial, sans-serif; fill: #f8fafc; }
      .axis { stroke: #c7d2de; stroke-width: 7; stroke-linecap: round; }
      .tick { stroke: #34495e; stroke-width: 2.4; stroke-linecap: round; opacity: .55; }
      .node-ring { stroke: #ffffff; stroke-width: 7; }
    </style>
  </defs>

  <rect width="1600" height="760" rx="0" fill="url(#paper)"/>
  <rect x="42" y="38" width="1516" height="684" rx="24" fill="none" stroke="#d9e1e8" stroke-width="1.4"/>

  <text x="92" y="102" class="figure-title">From Agent Societies to Verified Test-Time Computation</text>
  <text x="92" y="139" class="subtitle">The field shifted from imitating organizations to allocating, checking, and merging test-time work.</text>

  <line x1="158" y1="365" x2="1414" y2="365" class="axis"/>

  <g filter="url(#shadow)">
    <rect x="92" y="186" width="258" height="146" rx="18" fill="#e8f2f8" stroke="#a7c2d6" stroke-width="1.5"/>
    <text x="120" y="224" class="phase-year">pre-2023</text>
    <text x="120" y="258" class="phase-title">Coordination</text>
    <text x="120" y="284" class="body">MAS and MARL define</text>
    <text x="120" y="307" class="body">the hard problems.</text>
    <line x1="221" y1="332" x2="221" y2="339" class="tick"/>
    <circle cx="221" cy="365" r="18" fill="#315775" class="node-ring"/>
    <rect x="92" y="420" width="258" height="126" rx="18" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <text x="120" y="454" class="tag-title">Representative pressures</text>
    <text x="120" y="485" class="small">partial observability</text>
    <text x="120" y="512" class="small">credit assignment</text>
    <text x="120" y="539" class="small">communication bandwidth</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="383" y="186" width="258" height="146" rx="18" fill="#e9f5ed" stroke="#9fc7ad" stroke-width="1.5"/>
    <text x="411" y="224" class="phase-year">2023</text>
    <text x="411" y="258" class="phase-title">Agent societies</text>
    <text x="411" y="287" class="body">Roles, debate, social</text>
    <text x="411" y="312" class="body">simulation, software teams.</text>
    <line x1="512" y1="332" x2="512" y2="339" class="tick"/>
    <circle cx="512" cy="365" r="18" fill="#3b7d4f" class="node-ring"/>
    <rect x="383" y="420" width="258" height="126" rx="18" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <text x="411" y="454" class="tag-title">Representative systems</text>
    <text x="411" y="485" class="small">CAMEL, ChatDev</text>
    <text x="411" y="512" class="small">MetaGPT, AutoGen</text>
    <text x="411" y="539" class="small">debate and recruitment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="674" y="186" width="258" height="146" rx="18" fill="#edf0fb" stroke="#acb7dc" stroke-width="1.5"/>
    <text x="702" y="224" class="phase-year">2024</text>
    <text x="702" y="258" class="phase-title">Runtimes</text>
    <text x="702" y="287" class="body">Frameworks expose</text>
    <text x="702" y="312" class="body">scheduling, tools, state.</text>
    <line x1="803" y1="332" x2="803" y2="339" class="tick"/>
    <circle cx="803" cy="365" r="18" fill="#5767a8" class="node-ring"/>
    <rect x="674" y="420" width="258" height="126" rx="18" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <text x="702" y="454" class="tag-title">Substrate becomes visible</text>
    <text x="702" y="485" class="small">orchestrators</text>
    <text x="702" y="512" class="small">memory and permissions</text>
    <text x="702" y="539" class="small">logs and validators</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="965" y="186" width="268" height="146" rx="18" fill="#fff1e6" stroke="#d7ae8a" stroke-width="1.5"/>
    <text x="993" y="224" class="phase-year">2024-2026</text>
    <text x="993" y="258" class="phase-title">Evidence turn</text>
    <text x="993" y="287" class="body">Benchmarks, failures,</text>
    <text x="993" y="312" class="body">costs, equal budgets.</text>
    <line x1="1099" y1="332" x2="1099" y2="339" class="tick"/>
    <circle cx="1099" cy="365" r="18" fill="#b46a39" class="node-ring"/>
    <rect x="965" y="420" width="268" height="126" rx="18" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <text x="993" y="454" class="tag-title">Evidence changes standard</text>
    <text x="993" y="485" class="small">realistic task completion</text>
    <text x="993" y="512" class="small">trace inspection</text>
    <text x="993" y="539" class="small">artifact degradation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1266" y="186" width="258" height="146" rx="18" fill="#e7f2ef" stroke="#9bbfb7" stroke-width="1.5"/>
    <text x="1294" y="224" class="phase-year">emerging</text>
    <text x="1294" y="258" class="phase-title">Artifact systems</text>
    <text x="1294" y="287" class="body">Branch, verify, merge,</text>
    <text x="1294" y="312" class="body">remember, escalate.</text>
    <line x1="1395" y1="332" x2="1395" y2="339" class="tick"/>
    <circle cx="1395" cy="365" r="18" fill="#2f6c66" class="node-ring"/>
    <rect x="1266" y="420" width="258" height="126" rx="18" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <text x="1294" y="454" class="tag-title">Durable work products</text>
    <text x="1294" y="485" class="small">verified progress</text>
    <text x="1294" y="512" class="small">provenance and safety</text>
    <text x="1294" y="539" class="small">adaptive orchestration</text>
  </g>

  <rect x="92" y="615" width="1432" height="64" rx="18" fill="#111827"/>
  <text x="122" y="654" class="footer">The mature question is not how many agents to run, but which coordination structure turns extra inference into reliable work.</text>
</svg>
