<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Structured test-time computation loop</title>
  <desc id="desc">A loop showing agents expanding search, creating artifacts, verifying outputs, pruning or merging attempts, updating state, and escalating uncertain decisions.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#243447"/>
    </marker>
    <marker id="dash-arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#7a8390"/>
    </marker>
    <style>
      .figure-title { font: 700 39px "Helvetica Neue", Arial, sans-serif; fill: #101820; }
      .subtitle { font: 400 21px "Helvetica Neue", Arial, sans-serif; fill: #5b6673; }
      .num { font: 700 18px "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .node-title { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .body { font: 400 18px "Helvetica Neue", Arial, sans-serif; fill: #2d3748; }
      .small { font: 500 17px "Helvetica Neue", Arial, sans-serif; fill: #4d5968; }
      .side-title { font: 700 22px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .footer { font: 500 20px "Helvetica Neue", Arial, sans-serif; fill: #f8fafc; }
      .flow { stroke: #243447; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .risk-link { stroke: #7a8390; stroke-width: 3; stroke-dasharray: 9 9; fill: none; marker-end: url(#dash-arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="url(#paper)"/>
  <rect x="42" y="38" width="1516" height="784" rx="24" fill="none" stroke="#d9e1e8" stroke-width="1.4"/>

  <text x="92" y="102" class="figure-title">Multi-Agent Value as Search Plus Verification</text>
  <text x="92" y="139" class="subtitle">Agents are useful when they create non-redundant candidates and the system can check, merge, or reject them.</text>

  <g opacity=".45">
    <path d="M454 258 C560 185 704 172 822 219" stroke="#d9e1e8" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M978 280 C1069 362 1088 501 1025 604" stroke="#d9e1e8" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M881 682 C746 745 580 722 468 620" stroke="#d9e1e8" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M354 510 C313 400 347 317 454 258" stroke="#d9e1e8" stroke-width="28" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="218" width="300" height="142" rx="20" fill="#e9f5ed" stroke="#9fc7ad" stroke-width="1.5"/>
    <circle cx="188" cy="260" r="22" fill="#3b7d4f"/>
    <text x="181" y="267" class="num">1</text>
    <text x="225" y="267" class="node-title">Expand Search</text>
    <text x="188" y="306" class="body">hypotheses, files, tools,</text>
    <text x="188" y="332" class="body">models, memories, plans</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="178" width="300" height="142" rx="20" fill="#e8f2f8" stroke="#a7c2d6" stroke-width="1.5"/>
    <circle cx="598" cy="220" r="22" fill="#315775"/>
    <text x="591" y="227" class="num">2</text>
    <text x="635" y="227" class="node-title">Create Artifacts</text>
    <text x="598" y="266" class="body">patches, tests, traces,</text>
    <text x="598" y="292" class="body">reports, extracted evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="218" width="300" height="142" rx="20" fill="#fff1e6" stroke="#d7ae8a" stroke-width="1.5"/>
    <circle cx="1008" cy="260" r="22" fill="#b46a39"/>
    <text x="1001" y="267" class="num">3</text>
    <text x="1045" y="267" class="node-title">Verify</text>
    <text x="1008" y="306" class="body">execute, retrieve, compare,</text>
    <text x="1008" y="332" class="body">audit, judge, ask humans</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="520" width="300" height="142" rx="20" fill="#edf0fb" stroke="#acb7dc" stroke-width="1.5"/>
    <circle cx="1008" cy="562" r="22" fill="#5767a8"/>
    <text x="1001" y="569" class="num">4</text>
    <text x="1045" y="569" class="node-title">Prune or Merge</text>
    <text x="1008" y="608" class="body">select candidates, resolve</text>
    <text x="1008" y="634" class="body">conflicts, reject failures</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="560" width="300" height="142" rx="20" fill="#f7f0df" stroke="#d0c18d" stroke-width="1.5"/>
    <circle cx="598" cy="602" r="22" fill="#9a7b21"/>
    <text x="591" y="609" class="num">5</text>
    <text x="635" y="609" class="node-title">Update State</text>
    <text x="598" y="648" class="body">memory, provenance,</text>
    <text x="598" y="674" class="body">plans, permissions, logs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="520" width="300" height="142" rx="20" fill="#f7ecf0" stroke="#d2a4b4" stroke-width="1.5"/>
    <circle cx="188" cy="562" r="22" fill="#9a4f68"/>
    <text x="181" y="569" class="num">6</text>
    <text x="225" y="569" class="node-title">Decide</text>
    <text x="188" y="608" class="body">continue, stop, escalate,</text>
    <text x="188" y="634" class="body">or launch new branches</text>
  </g>

  <path d="M452 275 C488 247 516 238 558 236" class="flow"/>
  <path d="M862 236 C904 238 932 247 968 275" class="flow"/>
  <path d="M1120 362 C1120 424 1120 459 1120 518" class="flow"/>
  <path d="M970 608 C930 634 904 643 862 644" class="flow"/>
  <path d="M558 644 C516 643 488 634 452 608" class="flow"/>
  <path d="M300 520 C300 459 300 424 300 362" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="1332" y="213" width="185" height="458" rx="20" fill="#ffffff" stroke="#d9e1e8" stroke-width="1.5"/>
    <rect x="1332" y="213" width="185" height="66" rx="20" fill="#f1f4f7"/>
    <path d="M1332 259 H1517" stroke="#f1f4f7" stroke-width="40"/>
    <text x="1362" y="255" class="side-title">Failure Modes</text>
    <text x="1362" y="314" class="small">correlated errors</text>
    <text x="1362" y="356" class="small">summarization loss</text>
    <text x="1362" y="398" class="small">shared-state drift</text>
    <text x="1362" y="440" class="small">weak verification</text>
    <text x="1362" y="482" class="small">merge conflicts</text>
    <text x="1362" y="524" class="small">unsafe propagation</text>
    <text x="1362" y="566" class="small">human review bottlenecks</text>
  </g>

  <path d="M1270 292 C1296 300 1310 321 1332 353" class="risk-link"/>
  <path d="M1270 591 C1298 582 1312 556 1332 524" class="risk-link"/>

  <rect x="92" y="745" width="1432" height="64" rx="18" fill="#111827"/>
  <text x="122" y="784" class="footer">A multi-agent design should maximize useful diversity and verifier strength while minimizing coordination cost and contamination risk.</text>
</svg>
