<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 26 26" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Two quarter-circle arrows (clockwise flow) -->
  <!-- Top-right arc: from left to upper-right (avoids antenna at x=12) -->
  <path d="M1,10 A11,11 0 0,1 17,1" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Arrowhead at (17,1) pointing right -->
  <polygon points="17,-1 17,3 19.5,1" fill="#000000" stroke="none"/>

  <!-- Bottom-left arc: from right to lower-left -->
  <path d="M23,12 A11,11 0 0,1 7,21" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Arrowhead at (7,21) pointing left -->
  <polygon points="7,19 7,23 4.5,21" fill="#000000" stroke="none"/>

  <!-- Robot head (upper portion) -->
  <rect x="7" y="4.5" width="10" height="7.5" rx="2.5" fill="#f5f5f5" stroke="#000000" stroke-width="1.3"/>
  <!-- Eyes -->
  <circle cx="10" cy="7.5" r="0.9" fill="#000000" stroke="none"/>
  <circle cx="14" cy="7.5" r="0.9" fill="#000000" stroke="none"/>
  <!-- Smile -->
  <path d="M10.2 10 Q12 11.3 13.8 10" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Antenna -->
  <line x1="12" y1="4.5" x2="12" y2="2.5" stroke="#000000" stroke-width="1.2"/>
  <circle cx="12" cy="2" r="0.7" fill="#000000" stroke="none"/>

  <!-- Tool icons below head, inside the loop -->
  <!-- Folder (left) -->
  <path d="M4 16 L4 14.5 L5.5 14.5 L6 15 L8.5 15 L8.5 18.5 L4 18.5 Z" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Magnifying glass (center) -->
  <circle cx="12" cy="16.5" r="1.5" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="13.1" y1="17.6" x2="14.2" y2="18.7" stroke="#000000" stroke-width="1"/>
  <!-- Execute / play triangle (right) -->
  <polygon points="16,15 19,17 16,19" fill="none" stroke="#000000" stroke-width="1"/>
</svg>
