<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 0 27 30" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Stack of 3 rounded lozenges (drawn first = lower z) -->
  <!-- Back -->
  <path d="M11.1,23.5 Q13,23 14.9,23.5 L23.1,25.5 Q25,26 23.1,26.5 L14.9,28.5 Q13,29 11.1,28.5 L2.9,26.5 Q1,26 2.9,25.5 Z" fill="#c8ccd3" stroke="#000000" stroke-width="1.8"/>
  <!-- Middle -->
  <path d="M10.1,20.5 Q12,20 13.9,20.5 L22.1,22.5 Q24,23 22.1,23.5 L13.9,25.5 Q12,26 10.1,25.5 L1.9,23.5 Q0,23 1.9,22.5 Z" fill="#e0e4ea" stroke="#000000" stroke-width="1.8"/>
  <!-- Front -->
  <path d="M9.1,17.5 Q11,17 12.9,17.5 L21.1,19.5 Q23,20 21.1,20.5 L12.9,22.5 Q11,23 9.1,22.5 L0.9,20.5 Q-1,20 0.9,19.5 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

  <!-- Robot head (drawn last = on top, sitting on lozenges) -->
  <rect x="4" y="8" width="14" height="10.5" rx="3" fill="#f5f5f5" stroke="#000000" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="8.5" cy="12.5" r="1" fill="#000000" stroke="none"/>
  <circle cx="13.5" cy="12.5" r="1" fill="#000000" stroke="none"/>
  <!-- Smile -->
  <path d="M9 15 Q11 16.8 13 15" fill="none" stroke="#000000" stroke-width="1.1"/>
  <!-- Antenna -->
  <line x1="11" y1="8" x2="11" y2="5.5" stroke="#000000" stroke-width="1.3"/>
  <circle cx="11" cy="5" r="0.9" fill="#000000" stroke="none"/>
</svg>
