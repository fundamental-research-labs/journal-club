<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" width="64" height="64">
  <!-- Round-robin icon: circle with 5 evenly spaced dots -->
  <!-- Thin circle ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#000" stroke-width="2.5"/>
  <!-- 5 dots at 72° intervals, starting from top (–90°) -->
  <!-- dot 1: top (270°) => (32 + 22*cos270, 32 + 22*sin270) = (32, 10) -->
  <!-- dot 2: 342° => (32 + 22*cos342, 32 + 22*sin342) = (52.93, 25.20) -->
  <!-- dot 3: 54°  => (32 + 22*cos54,  32 + 22*sin54)  = (44.93, 49.80) -->
  <!-- dot 4: 126° => (32 + 22*cos126, 32 + 22*sin126) = (19.07, 49.80) -->
  <!-- dot 5: 198° => (32 + 22*cos198, 32 + 22*sin198) = (11.07, 25.20) -->
  <g fill="#000" stroke="none">
    <circle cx="32" cy="10" r="4.5"/>
    <circle cx="52.93" cy="25.20" r="4.5"/>
    <circle cx="44.93" cy="49.80" r="4.5"/>
    <circle cx="19.07" cy="49.80" r="4.5"/>
    <circle cx="11.07" cy="25.20" r="4.5"/>
  </g>
</svg>
