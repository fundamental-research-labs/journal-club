<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top-left doc: play button (music/video) -->
  <rect x="1.5" y="1.5" width="9" height="9" rx="1"/>
  <polygon points="4.5,3.5 4.5,8.5 8.5,6" fill="black" stroke="none"/>
  <!-- Top-right doc: curly braces (code/JSON) -->
  <rect x="13.5" y="1.5" width="9" height="9" rx="1"/>
  <text x="18" y="8.5" font-size="7" fill="black" stroke="none" font-family="monospace" font-weight="bold" text-anchor="middle">{}</text>
  <!-- Bottom-left doc: table grid (spreadsheet) -->
  <rect x="1.5" y="13.5" width="9" height="9" rx="1"/>
  <line x1="1.5" y1="16.5" x2="10.5" y2="16.5" stroke-width="1"/>
  <line x1="1.5" y1="19.5" x2="10.5" y2="19.5" stroke-width="1"/>
  <line x1="5.5" y1="13.5" x2="5.5" y2="22.5" stroke-width="1"/>
  <!-- Bottom-right doc: sigma (math/science) -->
  <rect x="13.5" y="13.5" width="9" height="9" rx="1"/>
  <text x="18" y="20.5" font-size="7" fill="black" stroke="none" font-family="serif" font-weight="bold" text-anchor="middle">Σ</text>
</svg>
