<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small context square in center -->
  <rect x="9" y="9" width="6" height="6" rx="0.5"/>
  <!-- Arrow up -->
  <line x1="12" y1="9" x2="12" y2="2"/>
  <polyline points="9.5 4.5 12 2 14.5 4.5"/>
  <!-- Arrow down -->
  <line x1="12" y1="15" x2="12" y2="22"/>
  <polyline points="9.5 19.5 12 22 14.5 19.5"/>
  <!-- Arrow left -->
  <line x1="9" y1="12" x2="2" y2="12"/>
  <polyline points="4.5 9.5 2 12 4.5 14.5"/>
  <!-- Arrow right -->
  <line x1="15" y1="12" x2="22" y2="12"/>
