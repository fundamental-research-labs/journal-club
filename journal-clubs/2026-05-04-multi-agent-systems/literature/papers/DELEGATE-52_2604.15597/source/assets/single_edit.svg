<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" width="64" height="64">
  <!-- Single-edit repeat icon: circular arrow with "1" in center -->
  <g fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular arc (nearly complete circle, gap at top for arrow) -->
    <path d="M 38 11 A 19 19 0 1 1 26 11"/>
  </g>
  <!-- Arrowhead at the end of the arc (pointing right, at top) -->
  <g fill="#000" stroke="none">
    <polygon points="38,11 31,5.5 31,16.5"/>
  </g>
  <!-- Bold "1" in center -->
  <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#000">1</text>
</svg>
