classification_policy:
  - Paper metadata field `classification` is authoritative when present.
  - Otherwise, `docs/seeds.md` provides curated role and sub-area hints by arXiv ID or title.
  - Topic and title inference is only a fallback and should be marked with inferred confidence.
  - The default tree y-axis uses `primary_subarea`; other axes should be separate views, not overloaded into one category.
