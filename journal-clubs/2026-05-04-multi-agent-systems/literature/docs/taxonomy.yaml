version: 1
default_subarea: needs-classification

subareas:
  - id: llm-mas-coordination
    label: LLM MAS & Coordination
    description: Core LLM multi-agent systems, frameworks, orchestration, communication, delegation, and agent organizations.
  - id: debate-reasoning
    label: Debate & Reasoning
    description: Multi-agent debate, deliberation, aggregation, collaborative reasoning, and test-time reasoning ensembles.
  - id: software-web-computer-use
    label: Software, Web & Computer-Use
    description: Software engineering agents, browser agents, GUI/computer-use agents, mobile agents, workplace automation, and tool-using operational agents.
  - id: benchmarks-evaluation
    label: Benchmarks & Evaluation
    description: General agent benchmarks, evaluation methodology, datasets, benchmark suites, and measurement papers not tied to a narrower domain lane.
  - id: science-domain-agents
    label: Science & Domain Agents
    description: Scientific discovery, research automation, medical/domain simulations, and other specialized-domain agent systems.
  - id: safety-reliability
    label: Safety & Reliability
    description: Safety, security, robustness, failure analysis, harmful-use evaluation, and reliability work.
  - id: marl-foundations
    label: MARL & Foundations
    description: Pre-LLM MARL, emergent communication, self-play, social dilemmas, game-theoretic foundations, and classical multi-agent systems.
  - id: memory-infrastructure
    label: Memory & Infrastructure
    description: Agent memory, tool-use foundations, runtime interfaces, retrieval, infrastructure, and non-domain-specific agent-system building blocks.
  - id: scaling-optimization
    label: Scaling & Optimization
    description: Scaling laws, agent diversity, architecture search, topology optimization, training/post-training, and cost-performance optimization.
  - id: surveys-taxonomies
    label: Surveys & Taxonomies
    description: Field-organizing surveys, taxonomies, and methodology overviews.
  - id: needs-classification
    label: Needs Classification
    description: Papers that need manual taxonomy review.

roles:
  - id: core
    label: Core
    description: Directly about LLM-based multi-agent systems.
  - id: trend
    label: Trend
    description: Recent high-signal work included to track field direction.
  - id: bridge
    label: Bridge
    description: Adjacent agent infrastructure, evaluation, or foundation paper that shapes multi-agent systems.
  - id: anchor
    label: Anchor
    description: Older MARL, emergent communication, or classical MAS foundation.
  - id: survey
    label: Survey
    description: Field-organizing survey used for expansion.
  - id: unclassified
    label: Unclassified
    description: Role needs manual review.

artifact_types:
  - id: framework
    label: Framework/System
  - id: benchmark
    label: Benchmark/Dataset
  - id: method
    label: Method/Algorithm
  - id: empirical-study
    label: Empirical Study
  - id: survey
    label: Survey/Taxonomy
  - id: infrastructure
    label: Infrastructure/Codebase
  - id: unclassified
    label: Unclassified

domains:
  - id: llm-agents
    label: LLM Agents
  - id: software-engineering
    label: Software Engineering
  - id: web
    label: Web
  - id: computer-use
    label: Computer Use
  - id: mobile
    label: Mobile
  - id: science
    label: Science
  - id: safety
    label: Safety
  - id: marl
    label: MARL
  - id: memory
    label: Memory
  - id: tool-use
    label: Tool Use
  - id: multimodal
    label: Multimodal
  - id: simulation
    label: Simulation
